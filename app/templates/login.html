<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Crop Advisory System - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
    url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80")
    no-repeat center center/cover;
}

.box{

    width:380px;

    background:rgba(255,255,255,0.92);

    padding:40px;

    border-radius:20px;

    text-align:center;

    backdrop-filter:blur(10px);

    box-shadow:0 15px 35px rgba(0,0,0,.35);

    animation:fadeIn .8s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

font-size:60px;

margin-bottom:10px;

}

h2{

color:#2E8B57;

margin-bottom:5px;

font-size:30px;

}

.subtitle{

color:#666;

margin-bottom:30px;

font-size:15px;

}

input{

width:100%;

padding:14px;

margin:12px 0;

border:none;

border-radius:10px;

background:#eef4ff;

font-size:16px;

transition:.3s;

}

input:focus{

outline:none;

border:2px solid #2E8B57;

background:white;

}

button{

width:100%;

padding:14px;

margin-top:15px;

background:#2E8B57;

color:white;

border:none;

border-radius:10px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d6b42;

transform:scale(1.03);

}

.msg{

margin-top:15px;

color:red;

font-weight:bold;

}

.register{

margin-top:25px;

color:#444;

}

.register a{

color:#2E8B57;

font-weight:bold;

text-decoration:none;

}

.register a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="box">

<div class="logo">🌾</div>

<h2>Smart Crop Advisory System</h2>

<p class="subtitle">
AI-Based Crop Yield Prediction
</p>

<form method="POST">

<input
type="text"
name="username"
placeholder="👤 Username"
required>

<input
type="password"
name="password"
placeholder="🔒 Password"
required>

<button type="submit">
Login
</button>

</form>

<p class="msg">{{ message }}</p>

<p class="register">
New User?
<a href="/register">Register Here</a>
</p>

</div>

</body>
</html>
