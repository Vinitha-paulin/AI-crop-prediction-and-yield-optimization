<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Recommendation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("https://images.unsplash.com/photo-1500382017468-9049fed747ef")
center center/cover no-repeat;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.container{

width:550px;
background:rgba(255,255,255,.95);
padding:35px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.25);

}

h2{

text-align:center;
color:#2E8B57;
margin-bottom:25px;

}

label{

display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:600;

}

input{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;

}

input:focus{

outline:none;
border:2px solid #2E8B57;

}

button{

width:100%;
margin-top:25px;
padding:14px;
background:#2E8B57;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#1d6b42;

}

.result{

margin-top:25px;
background:#e8f5e9;
padding:20px;
border-left:6px solid green;
border-radius:10px;
text-align:center;

}

.result h3{

color:#2E8B57;

}

.back{

margin-top:20px;
text-align:center;

}

.back a{

text-decoration:none;
font-weight:bold;
color:#2E8B57;

}

</style>

</head>

<body>

<div class="container">

<h2>🌱 Crop Recommendation</h2>

<form action="/recommend" method="POST">

<label>Nitrogen (N)</label>
<input type="number" name="N" required>

<label>Phosphorus (P)</label>
<input type="number" name="P" required>

<label>Potassium (K)</label>
<input type="number" name="K" required>

<label>Temperature (°C)</label>
<input type="number" step="any" name="temperature" required>

<label>Humidity (%)</label>
<input type="number" step="any" name="humidity" required>

<label>Rainfall (mm)</label>
<input type="number" step="any" name="rainfall" required>

<button type="submit">
🌱 Recommend Crop
</button>

</form>

{% if crop %}

<div class="result">

<h3>✅ Recommended Crop</h3>

<h1 style="color:green;margin-top:15px;">
{{ crop }}
</h1>

</div>

{% endif %}

<div class="back">

<a href="/dashboard">⬅ Back to Dashboard</a>

</div>

</div>

</body>
</html>
